<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Signal</title>
<style>
@font-face { font-family: "Host Grotesk"; font-weight: 300 800; font-display: swap; src: url("/Signal/assets/fonts/host-grotesk-latin-wght-normal.woff2") format("woff2"); }
:root { color-scheme: light dark; --ink: #14161A; --ink2: #5B6170; --card: rgba(255,255,255,.7); --edge: rgba(255,255,255,.95); --bg: #F3F2F7; }
@media (prefers-color-scheme: dark) { :root { --ink: #F4F5F8; --ink2: #A9AFBF; --card: rgba(30,32,41,.7); --edge: rgba(255,255,255,.1); --bg: #111319; } }
html, body { margin: 0; min-height: 100%; background: var(--bg); }
body { font-family: "Host Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ink);
  background: var(--bg) url("/Signal/assets/email/ground-bottom-light.jpg") center bottom / 100% auto no-repeat; min-height: 100vh;
  display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; }
@media (prefers-color-scheme: dark) { body { background-image: url("/Signal/assets/email/ground-bottom-dark.jpg"); } }
.c { max-width: 420px; width: 100%; background: var(--card); border: 1px solid var(--edge); border-radius: 22px; padding: 22px 20px; box-sizing: border-box; }
b { display: block; font-size: 14px; font-weight: 600; } h1 { font-size: 26px; line-height: 1.1; letter-spacing: -.02em; font-weight: 600; margin: 14px 0 8px; }
p { margin: 0; font-size: 15px; line-height: 1.45; color: var(--ink2); } a { color: var(--ink); font-weight: 600; }
</style></head><body><main class="c"><b>Signal</b><h1 id="h">One moment</h1><p id="p"></p></main>
<script>
(function () {
  var root = "/Signal/", h = document.getElementById("h"), p = document.getElementById("p");
  var m = location.pathname.match(/\/d\/(\d{4}-\d{2}-\d{2})(-weekly)?\/?$/);
  var fresh = m && (Date.now() - Date.parse(m[1] + "T00:00:00Z")) < 36 * 3600 * 1000;
  var tries = +(new URLSearchParams(location.search).get("r") || 0);
  if (fresh && tries < 20) {
    h.textContent = "Your briefing is on its way";
    p.innerHTML = "It is being published right now. This page checks again by itself every 15 seconds, or open <a href=\"" + root + "\">the latest briefing</a>.";
    setTimeout(function () { location.replace(location.pathname + "?r=" + (tries + 1) + location.hash); }, 15000);
  } else {
    h.textContent = m ? "This briefing has left the archive" : "Nothing here";
    p.innerHTML = "Signal keeps the last 14 briefings. Taking you to <a href=\"" + root + "\">the latest one</a>.";
    setTimeout(function () { location.replace(root); }, 2500);
  }
})();
</script></body></html>
