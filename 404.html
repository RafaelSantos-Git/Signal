<style>

:root[data-theme="light"] { color-scheme: light; --grain-o: .22; --card-grain-o: .15; --card: linear-gradient(180deg, #FFFFFF 0%, #FCFCFD 40%, #F8F8FA 100%); --card-light: radial-gradient(110% 62% at 0% 0%, rgba(255,255,255,.9), rgba(255,255,255,0) 62%); --edge-top: rgba(255,255,255,1); --shadow-near: rgba(20,22,30,.06); --shadow-far: rgba(20,22,30,.22); --glass: linear-gradient(180deg, rgba(255,255,255,.74), rgba(255,255,255,.56)); --glass-edge-top: rgba(255,255,255,.95); --glass-edge: rgba(255,255,255,.6); --canvas: #F5F5F7; --ground: radial-gradient(110% 44% at -10% -8%, rgba(255,255,255,1) 0%, rgba(255,255,255,0) 70%), radial-gradient(70% 30% at 108% 0%, rgba(200,206,218,.35) 0%, rgba(200,206,218,0) 72%), linear-gradient(180deg, #FAFAFB 0%, #F5F5F7 45%, #EDEEF1 100%); --bead: radial-gradient(circle at 34% 30%, #FFFFFF 0 10%, #E6E8EC 24%, #A3A8B2 50%, #555A63 76%, #1C1E22 100%); --bead-shadow: 0 0 0 .5px rgba(10,10,14,.25), 0 2px 6px rgba(10,10,14,.18); --fg: #0B0B0D; --fg-2: #3F434B; --fg-3: #656A74; --mark: #656A74; --line: rgba(10,10,14,.08); --line-2: rgba(10,10,14,.14); --track: rgba(10,10,14,.12); --accent: #0B0B0D; --on-accent: #FFFFFF; --accent-shadow: 0 6px 14px -6px rgba(0,0,0,.4); --focus: #0B0B0D; --status-bg: rgba(10,10,14,.04); --status-edge: rgba(10,10,14,.10); --edge: rgba(10,10,14,.06); --live: #0B0B0D; --live-ring: rgba(10,10,14,.12); --live-glow: rgba(10,10,14,.2); --paper: linear-gradient(180deg, #1C1D21 0%, #131417 40%, #0B0B0D 100%); --paper-light: radial-gradient(90% 80% at 0% 0%, rgba(255,255,255,.10), rgba(255,255,255,0) 60%); --paper-edge-top: rgba(255,255,255,.14); --paper-edge: rgba(255,255,255,.06); --paper-grain-blend: overlay; --paper-grain-o: .3; --ink: #F5F5F7; --ink-2: #B8BCC5; --ink-3: #9DA2AC; --play: #F5F5F7; --play-icon: #0B0B0D; --play-shadow: inset 0 1px 0 rgba(255,255,255,.8), 0 10px 22px -10px rgba(0,0,0,.6); --paper-chip: rgba(255,255,255,.07); --paper-chip-edge: rgba(255,255,255,.16); --paper-track: rgba(255,255,255,.16); --paper-fill: #F5F5F7; --quote: rgba(255,255,255,.10); --chip: rgba(10,10,14,.04); --chip-hover: rgba(10,10,14,.08); --tint: rgba(10,10,14,.06); --tint-soft: rgba(10,10,14,.04); --tint-edge: rgba(10,10,14,.12); --mini: linear-gradient(180deg, rgba(255,255,255,.84), rgba(248,248,250,.80)); --mo-hi: 255,255,255; --mo-l: 196,202,214; --mo-r: 120,128,145; --mo-body: #EEF0F3; --mo-deep: #C9CDD5; --stage-ground: url("/Signal/assets/stage-ground-light.webp"); --stage-still: url("/Signal/assets/stage-still-light.webp"); }

@font-face { font-family: "Host Grotesk"; font-weight: 300 800; font-display: swap; src: url("/Signal/assets/fonts/host-grotesk-latin-wght-normal.woff2") format("woff2"); }
@font-face { font-family: "Newsreader"; font-weight: 400 600; font-display: swap; src: url("/Signal/assets/fonts/newsreader-latin-display-normal.woff2") format("woff2"); }
html, body { margin: 0; min-height: 100%; background: var(--canvas); }
body { font-family: "Host Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--fg-2); min-height: 100vh; background: var(--ground);
  background-attachment: fixed; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
.c { max-width: 420px; width: 100%; border-radius: 28px; padding: 24px 22px 22px; box-sizing: border-box; background: var(--card);
  box-shadow: inset 0 1px 0 var(--edge-top), inset 0 0 0 1px var(--edge), 0 26px 50px -28px var(--shadow-far); }
b { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 600; color: var(--fg); }
b i { width: 12px; height: 12px; border-radius: 50%; background: var(--bead); box-shadow: var(--bead-shadow); }
h1 { font-family: "Newsreader", Georgia, serif; font-size: 30px; line-height: 1.12; letter-spacing: -.016em; font-weight: 500; color: var(--fg); margin: 18px 0 8px; }
p { margin: 0; font-size: 15px; line-height: 1.5; } a { color: var(--fg); font-weight: 600; text-underline-offset: 3px; }
</style></head><body><main class="c"><b><i aria-hidden="true"></i>Signal</b><h1 id="h">One moment</h1><p id="p"></p></main>
<script>
(function () {
  var root = "/Signal/", h = document.getElementById("h"), p = document.getElementById("p");
  var m = location.pathname.match(/\/d\/(\d{4}-\d{2}-\d{2})(-weekly)?\/?$/);
  var fresh = m && (Date.now() - Date.parse(m[1] + "T00:00:00Z")) < 36 * 3600 * 1000;
  var tries = +(new URLSearchParams(location.search).get("r") || 0);
  if (fresh && tries < 20) {
    h.textContent = "Your briefing is on its way";
    p.innerHTML = "It is being published right now. This page checks again by itself every 15 seconds, or open <a href=\"" + root + "\">the latest briefing</a>.";
    setTimeout(function () { location.replace(location.pathname + "?r=" + (tries + 1) + location.hash); }, 15000);
  } else {
    h.textContent = m ? "This briefing has left the archive" : "Nothing here";
    p.innerHTML = "Signal keeps the last 14 briefings. Taking you to <a href=\"" + root + "\">the latest one</a>.";
    setTimeout(function () { location.replace(root); }, 2500);
  }
})();
</script></body></html>
